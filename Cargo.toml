[workspace]
resolver = "2"
members = ["crates/ultracompress-core", "crates/ultracompress-cli"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Implose Cybernetics"]
homepage = "https://github.com/michael-berardi/ultracompress"
keywords = ["llm", "compaction", "context-window", "ai-agents", "claude-code"]
categories = ["command-line-utilities", "compression", "development-tools"]
repository = "https://github.com/michael-berardi/ultracompress"
description = "UltraCompress — content-aware conversation compaction: VCC briefs, snap frames, lossless raw-history recall."

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
png = "0.18"
font8x8 = "0.3"
regex = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
