[workspace]
resolver = "2"
members = ["crates/rc-core", "crates/rc-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/sting8k/rapid-compact"
description = "Rapid Compact — content-aware conversation compaction: VCC briefs, snap frames, UC packets, one policy engine."

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
png = "0.18"
font8x8 = "0.3"
regex = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
